name: Schedule Test

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Print trigger info
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "GitHub ref: ${{ github.ref }}"
          echo "Current UTC time:"
          date -u
          echo "Schedule test completed."